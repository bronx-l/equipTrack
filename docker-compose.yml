services:
  web:
    build: .
    container_name: equiptrack_web
    command: gunicorn equiptrack.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: equiptrack_db
    restart: always
    environment:
      POSTGRES_DB: equiptrack
      POSTGRES_USER: equiptrack_user
      POSTGRES_PASSWORD: equiptrack_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equiptrack_user -d equiptrack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: