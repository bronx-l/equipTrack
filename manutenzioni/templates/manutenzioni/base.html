<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>EquipTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">

    <a class="navbar-brand"
       href="{% url 'manutenzioni:veicolo_list' %}">
        EquipTrack
    </a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu">

        <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse"
         id="navMenu">

        <ul class="navbar-nav me-auto">

            <li class="nav-item">

                <a class="nav-link
                   {% if request.resolver_match.url_name == 'veicolo_list' %}
                       active
                   {% endif %}"
                   href="{% url 'manutenzioni:veicolo_list' %}">

                    I miei veicoli

                </a>

            </li>

            <li class="nav-item">

                <a class="nav-link
                   {% if request.resolver_match.url_name == 'intervento_create' %}
                       active
                   {% endif %}"
                   href="{% url 'manutenzioni:intervento_create' %}">

                    Nuovo intervento

                </a>

            </li>

        </ul>


        {% if user.is_authenticated %}

            <span class="text-white d-flex align-items-center gap-2">

                Ciao, {{ user.username }}

                <form method="post"
                      action="{% url 'logout' %}"
                      class="d-inline mb-0">

                    {% csrf_token %}

                    <button type="submit"
                            class="btn btn-sm btn-outline-light">

                        Logout

                    </button>

                </form>

            </span>

        {% else %}

            <a href="{% url 'login' %}"
               class="btn btn-outline-light btn-sm">

                Login

            </a>

        {% endif %}

    </div>

</nav>


<div class="container mt-3">

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }} alert-dismissible fade show"
                 role="alert">

                {{ message }}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Chiudi">
                </button>

            </div>

        {% endfor %}

    {% endif %}

</div>


<div class="container mt-4">

    {% block content %}

    {% endblock %}

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
